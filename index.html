<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Audioguide der Ausstellung – responsiver Audioplayer">
  <title>Audioguide</title>
  <link rel="icon" type="image/svg+xml" href="assets/cover.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player" aria-label="Audioplayer">
    <img id="cover" class="cover" src="assets/cover.svg" alt="Cover des Werks">

    <h1 id="title" class="title">Audioguide</h1>
    <p id="artist" class="artist">Titel &amp; Künstler:in in app.js anpassen</p>

    <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>

    <div class="progress">
      <span id="current" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Wiedergabeposition">
      <span id="duration" class="time">0:00</span>
    </div>

    <div class="controls">
      <button id="stop" class="btn" type="button" aria-label="Stopp">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button id="play" class="btn btn-play" type="button" aria-label="Abspielen">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="volume">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Lautstärke">
    </div>

    <footer id="credits" class="credits"></footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
